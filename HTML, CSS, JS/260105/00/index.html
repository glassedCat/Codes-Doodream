    <h2>try ~ catch 에러 객체 (error / e)</h2>
    <script>
        try {
            // JSON.parse("{name: 'kim'}"); // 잘못된 JSON
            JSON.parse('{"name": "kim"}');  //잘된 jSON

        } catch (e) {
            document.write("에러설명 : " + e.message +"<br>");
            document.write("에러 타입 : " + e.name);
        }
    </script>
