<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본 그리드</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
    <script src="./js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="container">
        <div class="row my-3"> <!-- my-3: margin-y-3 -->

            </div>
            <div class="col">

            </div>
            <div class="col">

            </div>
            <div class="col">

            </div>

    <div class="container">

            <div class="col-6">
                <div class="text-bg-danger p-3">col</div>
            </div>
        </div>
    </div>

    <div class="container overflow-hidden">
        <div class="row g-3">
            <div class="col-6">
                <div class="text-bg-danger p-3">col</div>
            </div>
            <div class="col-6">
                <div class="text-bg-danger p-3">col</div>

            -gx: gutter x축
            -gy: gutter y축
        -->
        <div class="row g-3"> <!-- row greed 3(out of 1~12) -->
            <div class="col-sm-4 col-lg-2"> <!-- column small 4(out of 1~12) -->
                <div class="text-bg-danger p-3">col</div>
            </div>
