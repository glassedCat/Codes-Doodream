<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="./css/bootstrap.css">
</head>
<body>
  <!-- 
   emmet 약어-복수 태그 한번에 만들기
   1. [태그*만들 갯수]
   (p*4)

   2. [ 감쌀 태그>내부 태그{내부에 써줄 내용}*만들갯수]  
   (div>p{item}*3)

   3. [태그.클래스명>내부태그*만들갯수]
   (div.container{item}*3) 
   (클래스명의 공백은 전부 . 으로 붙여줘야한다.)(예: div.bg-warning.p-5.m-1 >> <div class="bg-warning p-5 m-1></div>")

   4. [태그#아이디명*만들 갯수 / 태그#아이디명$식별번호*만들갯수]
   (div>p#name$*3) >> 
   <div>
    <p id="name1"></p>
    <p id="name2"></p>
    <p id="name3"></p>
   </div>

   5. 
   - . 은 클래스를 의미, 공백으로 된 이름의 클래스도 .으로 표기
   - #은 아이디를 의미
   - $은 1부터 차례대로 나열됨을 의미 ($*5면 1 2 3 4 5)
   - *는 만들 갯수를 의미
   - >는 상위 태그와 내부 태그를 의미, +는 형제 태그를 의미 (div>div*3 | div+p)

   예시 1: 클래스명과 여러 아이디를 결합한 예 >>
   div>div.bg-warning.p-5.m-1#name$*3
   >>
   <div>
    <div class="bg-warning p-5 m-1" id="name1"></div>
    <div class="bg-warning p-5 m-1" id="name2"></div>
    <div class="bg-warning p-5 m-1" id="name3"></div>
   </div>

   예시 2: 형제 태그 3개와 3번째 태그를 부모 태그로 만들고 자식 태그를 4개 만들어보자.
   내부 아이템은 item으로 표시하고 1부터 4까지 순차적으로 이름이 써지게끔 해주자.
   외부에는 outer라는 클래스를 주고 outer_id라는 아이디를 주고, 내부에는 
   inner 라는 클래스를 주고 inner_id라는 아이디를 주자.

   >> div#outer_id-1-$.outer*4+p#outer_id-2-$.outer*4+ul#outer_id-3-$.outer>li#inner_id-$.inner*4
   >>   <div id="outer_id-1-1" class="outer"></div>
        <div id="outer_id-1-2" class="outer"></div>
        <div id="outer_id-1-3" class="outer"></div>
        <div id="outer_id-1-4" class="outer"></div>
        <p id="outer_id-2-1" class="outer"></p>
        <p id="outer_id-2-2" class="outer"></p>
        <p id="outer_id-2-3" class="outer"></p>
        <p id="outer_id-2-4" class="outer"></p>
        <ul id="outer_id-3-1" class="outer">
            <li id="inner_id-1" class="inner"></li>
            <li id="inner_id-2" class="inner"></li>
            <li id="inner_id-3" class="inner"></li>
            <li id="inner_id-4" class="inner"></li>
        </ul>
  -->

   <div>
    <p>item</p>
    <p>item</p>
    <p>item</p>
   </div>
   <div>
        <div class="bg-warning p-5 m-1">item</div> <!-- bg-color 배경-배경색상, waring 부트스트랩 경고색상(노랑) p-num 패딩, m-num 마진 -->
        <div class="bg-warning p-5 m-1">item</div>
        <div class="bg-warning p-5 m-1">item</div>
   </div>
   <div class="d-flex bg-success"> <!-- d-flex: display:flex -->
    <div class="bg-warning p-5 m-1" id="name1"></div>
    <div class="bg-warning p-5 m-1" id="name2"></div>
    <div class="bg-warning p-5 m-1" id="name3"></div>
   </div>
   <div class="d-flex bg-success justify-content-between"> <!-- justify-content-between: 양쪽으로 쭉 벌린다 -->
    <div class="bg-warning p-5 m-1">item1</div>
    <div class="bg-warning p-5 m-1">item2</div>
    <div class="bg-warning p-5 m-1">item3</div>
   </div>
   <hr>
   <h2>항목 정렬</h2>
   <div class="d-flex bg-success vh-100"> <!-- vh: viewport height, vh-100: viewport height 100% -->
    <div class="bg-warning p-5 m-1">item</div>
    <div class="bg-warning p-5 m-1">item</div>
    <div class="bg-warning p-5 m-1">item</div>
   </div>
   <hr>
   <div class="d-flex bg-success vh-100 align-items-baseline"> <!-- align...-baseline: 밑바닥 라인에 맞춰서 일렬로 정렬 -->
    <div class="bg-warning p-5 m-1">item</div>
    <div class="bg-warning p-5 m-1">item</div>
    <div class="bg-warning p-5 m-1">item</div>
   </div>
   





   <script src="./js/bootstrap.bundle.js"></script>
   
</body>
</html>
